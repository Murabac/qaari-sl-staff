name: qaari_sl_staff
description: Qaari SL staff app — Production upload and Admin review.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  dio: ^5.8.0+1
  just_audio: ^0.10.4
  file_picker: ^10.1.2
  record: ^6.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.2
  intl: ^0.20.2
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
